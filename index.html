    $('#dock').innerHTML=`<div class="climate"><button data-action="temp-minus" aria-label="降低温度">${icon('back')}</button><button class="temp" data-action="climate" aria-label="打开温度设置">${s.temp.toFixed(1)}<span>°</span></button><button data-action="temp-plus" aria-label="升高温度">${icon('chevron')}</button><button class="muted" data-action="vent" aria-label="${s.vent?'关闭':'开启'}通风">${icon('fan')}</button><span class="auto-label">AUTO</span></div><div class="dock-nav">${[['home','home','首页'],['map','map','候单地图'],['hub','rest','驻点休整'],['orders','orders','订单'],['controls','car','车控']].map(([page,ico,label])=>`<button data-action="tab" data-page="${page}" class="${active===page?'active':''}" ${active===page?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`).join('')}</div><div class="climate right"><button class="muted" data-action="mute" aria-label="${s.muted?'取消静音':'静音'}">${icon(s.muted?'mute':'sound')}</button><button data-action="climate" aria-label="调整风量">${icon('fan')}<span class="fan-level">${s.vent?s.fan:'OFF'}</span></button><button data-action="controls-shortcut" aria-label="座椅与舒适设置">${icon('seat')}</button></div>`;
  }
  function renderApp(){
    const views={home:homePage,map:mapPage,detail:detailPage,navigation:navigationPage,hub:hubPage,rest:restPage,away:awayPage,recovery:recoveryPage,orders:ordersPage,controls:controlsPage};
    $('#app').innerHTML=(views[s.page]||mapPage)();
    updateExperience();
  }

  function locationCard(p,index){return `<button class="location-card ${s.selected===p.id?'selected':''}" data-action="select-point" data-id="${p.id}" aria-label="查看${escape(p.name)}"><div class="location-top"><h2>${p.name}</h2><span class="distance">${p.distance} km ${icon('chevron').replace('class="icon','style="width:14px;height:14px;vertical-align:-2px" class="icon')}</span></div><p class="sub">${p.minutes} 分钟可达 · ${p.parking}</p><div class="facilities">${p.facilities.map(f=>`<span class="facility">${icon(f)}${facilityName[f]}</span>`).join('')}</div></button>`;}
  function mapPage(){
    const list=filteredPoints();
    return frameMap(`<div class="map-panel"><div class="map-heading"><div><p class="eyebrow">${{morning:'早间',noon:'午间',evening:'晚间'}[s.period]}候单 · 附近落脚点</p><h1>附近候单点</h1></div><div class="wait">已候单<br><strong id="waiting-time">${Math.floor((Date.now()-s.waitingSince)/60000)}</strong> 分钟</div></div><div class="search-box">${icon('search')}<input id="point-search" type="search" placeholder="搜索地点或周边设施" value="${escape(s.query)}" autocomplete="off" aria-label="搜索地点或周边设施">${s.query?`<button class="clear-search" data-action="clear-search" aria-label="清除搜索">${icon('close')}</button>`:''}</div><div class="filter-row">${[['all','综合'],['toilet','找厕所'],['food','吃点饭'],['charge','充个电']].map(([key,label])=>`<button class="chip ${s.filter===key?'active':''}" data-action="filter" data-filter="${key}" aria-pressed="${s.filter===key}">${label}</button>`).join('')}</div><div class="location-list">${list.length?list.map(locationCard).join(''):`<div class="empty-state">没有找到合适的地点<br><button data-action="clear-filter" style="color:var(--orange);margin-top:14px">清除条件，查看全部</button></div>`}</div><p class="map-bottom-hint">${icon('info')}候单区域参考个人经验，设施与停车信息请现场确认</p></div><div class="map-pill">${icon('park')}停车 · 餐食 · 公共设施</div><button class="map-shortcut" data-action="open-hub">${icon('rest')}驻车休整${icon('arrow')}</button>`);
  }
  function detailPage(){
    const p=selectedPoint();
    return frameMap(`<div class="map-panel"><article class="detail-card"><button class="back-button" data-action="back-map">${icon('back')}附近落脚点</button><p class="eyebrow">${p.context}</p><h1>${p.name}</h1><p class="sub">${p.area}</p><div class="detail-metrics"><div><strong>${p.minutes}<small>分钟</small></strong><span>预计到达</span></div><div><strong>${p.distance}<small>km</small></strong><span>前往距离</span></div><div><strong>${p.power}<small>kWh</small></strong><span>预计耗电</span></div></div><div class="detail-row">${icon('park')}<div><p>${p.parking}</p><small>${p.parkingDetail}</small></div></div><div class="detail-row">${icon(p.facilities[0])}<div><p>${p.facilityNote}</p><small>${p.facilities.map(f=>facilityName[f]).join(' · ')}，设施信息为演示数据</small></div></div><div class="detail-actions"><button class="primary" data-action="start-navigation">前往这里${icon('arrow')}</button><button class="icon-button ${s.saved.includes(p.id)?'saved':''}" data-action="save-point" aria-label="${s.saved.includes(p.id)?'取消收藏':'收藏地点'}" aria-pressed="${s.saved.includes(p.id)}">${icon('star')}</button></div><p class="fine-note" style="margin-top:15px">仅展示停靠与补给条件，不承诺订单数量。</p></article></div>`);
  }
  function navigationPage(){
    const pickup=s.nav==='pickup',dropoff=s.nav==='dropoff';
    const p=s.spot||selectedPoint();
    let heading=p.name,sub=p.area,eyebrow='前往落脚点',minutes=p.minutes,dist=p.distance;
    if(pickup){heading='东湖国际 · 西门';sub='接驾点附近请留意乘客位置';eyebrow='前往接客 · 尾号 0816';minutes=3;dist='0.8';}
    if(dropoff){heading='成都东站 · 出发层';sub='乘客已上车，正在前往目的地';eyebrow='送达乘客 · 尾号 0816';minutes=24;dist='11.2';}
    return frameMap(`<div class="map-panel"><article class="nav-card"><div class="nav-direction">${icon('turn')}<div><strong>300 <small>m</small></strong><p>右转进入锦华路</p></div></div><p class="eyebrow">${eyebrow}</p><h2>${heading}</h2><p class="sub">${sub}</p><div class="nav-summary"><div><strong>${minutes}<small>分钟</small></strong><span>预计行程</span></div><div><strong>${dist}<small>km</small></strong><span>剩余距离</span></div></div>${s.order?`<div class="passenger-box"><div class="nav-avatar">乘</div><div><strong>乘客 · 尾号 0816</strong><small>普通快车 · 行程演示</small></div><button class="icon-button" style="width:43px;height:43px" data-action="call-passenger" aria-label="联系乘客">${icon('phone')}</button></div>`:''}<button class="primary accent" data-action="${pickup?'picked-up':dropoff?'finish-order':'arrived'}">${pickup?'已接到乘客':dropoff?'确认送达，完成行程':'已到达，进入驻点'}${icon('arrow')}</button>${!s.order?'<button class="secondary" data-action="cancel-navigation">取消前往</button>':''}<p class="fine-note" style="margin-top:15px">路线为演示示意。点击到达按钮推进原型流程。</p></article></div><div class="map-pill">${icon('compass')}${pickup?'接驾中':dropoff?'行程服务中':'前往停靠点'} · 驾驶信息优先</div>`,true);
  }

  function hubPage(){
    const m=modeText[s.configMode];
    return `<div class="page-pad"><div class="page-heading"><div><p class="eyebrow">驻点休整</p><h1>驻点休整</h1><p>${s.spot?`${s.spot.name} · 已到达`:'选择模式并设置时长'}</p></div><span class="parked-label"><strong>P</strong>车辆已驻车</span></div><div class="hub-grid"><div class="hub-preview"><span class="cabin-badge">${icon(m.icon)}${m.name} · 设置</span><span class="cabin-tag">YOUR MOMENT</span>${cabinSVG(s.configMode)}<h2>${m.desc}</h2><p>${m.sub}</p></div><div class="hub-config"><div class="mode-picker">${Object.entries(modeText).map(([key,v])=>`<button class="mode-card ${s.configMode===key?'active':''}" data-action="mode" data-mode="${key}" aria-pressed="${s.configMode===key}">${icon(v.icon)}<strong>${v.name}</strong><small>${{meal:'桌板与局部照明',nap:'座椅与环境调节',away:'暂停接单与锁车'}[key]}</small></button>`).join('')}</div><div><p class="config-label">${s.configMode==='away'?'预计离车时间':'休整时长'}<span>随时可以提前结束</span></p><div class="duration-row">${[10,15,20,30].map(n=>`<button class="duration ${s.duration===n?'active':''}" data-action="duration" data-value="${n}" aria-pressed="${s.duration===n}">${n} 分钟</button>`).join('')}</div></div><div class="order-option"><div><strong>${s.configMode==='meal'?(s.keepOnline?'用餐时继续候单':'用餐时暂停接单'):'先暂停接单，再'+(s.configMode==='nap'?'短休':'离车')}</strong><p>${s.configMode==='meal'?'你可以选择继续待命或暂时停下。保持候单时，来单会打断用餐。':'此状态下不接收新订单，结束后也不会自动恢复接单。'}</p></div>${s.configMode==='meal'?`<button class="switch ${s.keepOnline?'on':''}" role="switch" aria-checked="${s.keepOnline}" aria-label="用餐时继续候单" data-action="toggle-online-meal"></button>`:icon('lock')}</div><div class="mode-benefits">${m.benefits.map((b,i)=>`<span>${icon([m.icon,'light','fan'][i])}${b}</span>`).join('')}</div><button class="primary accent" data-action="begin-rest">${s.configMode==='meal'&&s.keepOnline?'保持候单，开始用餐':`暂停接单，${s.configMode==='meal'?'开始用餐':s.configMode==='nap'?'开始短休':'暂时离车'}`}${icon('arrow')}</button><p class="fine-note">接单暂停为原型模拟；真实使用需平台授权与规则支持。</p></div></div></div>`;
  }
  function formatTime(seconds){const n=Math.max(0,Math.ceil(seconds));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}
  function remaining(){return s.rest?Math.max(0,Math.ceil((s.rest.endsAt-Date.now())/1000)):0;}
  function restPage(){
    if(!s.rest)return hubPage();
    const mode=s.rest.mode,m=modeText[mode],done=remaining()<=0;
    return `<div class="active-rest"><div class="rest-visual"><span class="cabin-badge">${icon(m.icon)}${m.name} · 已开启</span><span class="cabin-tag">PARK & REST</span>${cabinSVG(mode,true)}<div class="art-caption"><p>${mode==='meal'?'桌板已展开 · 用餐区就绪':'座椅已放松 · 驻车休息中'}<br>空间示意，车控状态为原型模拟</p><span>TAKE YOUR TIME</span></div></div><div class="rest-main"><p class="eyebrow">${s.online?'继续候单 · 留意来单提示':'接单已暂停 · 不自动恢复'}</p><h1>${done?'休整已结束':mode==='meal'?'用餐中':'短休中'}</h1><p class="rest-sub">${s.online?'保持候单中。来单后先收好物品，再决定出发。':'接单已暂停。结束后手动恢复候单。'}</p><div class="countdown"><div id="rest-timer">${formatTime(remaining())}</div><span>${done?'休整已到时，请主动结束或延长':'剩余'+(mode==='meal'?'用餐':'休息')+'时间'}</span></div><div class="rest-state-row"><button class="setting-pill" data-action="toggle-light">${icon('light')}${s.light?'照明已开启':'照明已调暗'}</button><button class="setting-pill" data-action="toggle-vent">${icon('fan')}${s.vent?'通风已开启':'通风已关闭'}</button><button class="setting-pill" data-action="climate">${icon('sliders')}${s.temp.toFixed(1)}°C</button></div><div class="rest-actions"><button class="secondary" data-action="extend-rest">再加 5 分钟</button><button class="primary" data-action="end-rest">结束${mode==='meal'?'用餐':'短休'}${icon('arrow')}</button></div><p class="fine-note">${s.online?'当前仍在线候单，可随时结束用餐。':'暂停状态会保留至你完成准备，并主动恢复候单。'}</p></div></div>`;

    if(s.rest){step=3;heading=s.online?'点网页右上角「模拟来单」，再点「接受订单」':'可点「模拟来单」检验暂停状态，再结束休整';hint=s.online?'看用餐被打断时，系统如何先引导收好桌板、调整座椅，再前往接客。':'暂停时不会弹出订单。真实平台能否支持、对派单有何影响，仍需验证。';}
    if(s.page==='recovery'){step=4;heading='逐项确认三项准备，再点底部蓝色按钮';hint='把桌板、座椅和工作状态衔接起来；这是主动自检，系统没有检测车辆或人的实际状态。';}
    if(s.overlay==='incoming'){step=3;heading='点订单弹窗中的「接受订单」';hint=s.rest?'接受后先进入驾驶准备，不会直接从用餐状态跳到接驾。':'接受后进入接驾流程。';}
    if(s.overlay==='complete'){step=4;heading='体验完成：可以继续候单，也可以再安排休整';hint='方案关注找落脚点、用餐空间和回到工作的连续体验；并未解决平台派单规则。';}
    $('#experience-step').innerHTML=`<span class="experience-count">${step?String(step).padStart(2,'0'):'起点'}</span><div><strong>${heading}</strong><p>${hint}</p></div><span class="experience-label">网页体验提示 · 非车机内容</span>`;
  }
  function goHub(){
    if(s.order){toast('当前订单尚未完成，请先完成服务。');return;}
    if(!s.parked){toast('请先到达并停好车，再安排休整。');return;}
    s.page=s.rest?(s.rest.mode==='away'?'away':'rest'):'hub';render();
  }
  function startRest(){
    if(!s.parked||s.order){toast('请先完成订单并驻车，再开始休整。');return;}
    s.needsPreparation=false;s.rest={mode:s.configMode,endsAt:Date.now()+s.duration*60000,expired:false,previousLight:s.light,previousVent:s.vent};
    s.online=s.configMode==='meal'&&s.keepOnline;
    s.light=s.configMode!=='nap';s.vent=true;
    s.page=s.configMode==='away'?'away':'rest';render();toast(s.online?'用餐已开始，当前继续候单。':'接单已暂停，这段时间由你安排。');
  }
  function finishRest(){
    if(s.rest){s.light=s.rest.previousLight;s.vent=s.rest.previousVent;}
    s.rest=null;s.online=false;s.needsPreparation=true;s.nav=null;s.checks=[false,false,false];s.page='recovery';render();
  }
  function requestOrder(){
    if(s.order){toast('当前正在服务订单，不重复派入新单。');return;}
    if(!s.online){toast('当前接单已暂停，本次模拟未产生新订单。');return;}
    if(s.overlay==='incoming'){toast('请先处理当前订单提示。');return;}
    openOverlay('incoming');
  }
  function acceptOrder(){
    if(!s.online||s.order){closeOverlay();return;}
    s.order={stage:'pickup',acceptedAt:Date.now()};s.overlay=null;s.online=false;
    if(s.rest){finishRest();toast('订单已接受。请先收好物品，确认准备好再出发。');}
    else{s.nav='pickup';s.parked=false;s.page='navigation';render();}
  }
  function arrived(){s.parked=true;s.nav=null;s.page='hub';render();toast('已到达停靠点。请现场确认停车条件。');}
  function pickedUp(){if(!s.order)return;s.order.stage='dropoff';s.nav='dropoff';s.page='navigation';s.parked=false;render();toast('乘客已上车，正在前往目的地。');}
  function finishOrder(){
    if(!s.order)return;
    s.completed.unshift({time:clock(),from:'东湖国际 · 西门',to:'成都东站 · 出发层',price:32.6});
    s.order=null;s.nav=null;s.parked=true;s.online=false;s.page='orders';s.overlay=null;render();openOverlay('complete');
  }
  const actions={
    'open-map':()=>{if(s.needsPreparation){s.page='recovery';render();return;}if(s.rest){s.page=s.rest.mode==='away'?'away':'rest';render();return;}s.page=s.order||s.nav?'navigation':'map';render();},
    'toggle-lock':()=>{if(!s.parked){toast('行驶演示中，暂不调整车锁。');return;}s.locked=!s.locked;render();toast(s.locked?'车门已锁止 · 模拟':'车门已解锁 · 模拟');},
    'toggle-charge':()=>{if(!s.parked){toast('请驻车后操作充电口。');return;}s.chargePort=!s.chargePort;render();toast(s.chargePort?'充电口已打开 · 模拟':'充电口已关闭 · 模拟');},
    'select-point':b=>{if(s.order){toast('请先完成当前订单。');return;}s.selected=b.dataset.id;s.page='detail';render();},
    'filter':b=>{s.filter=b.dataset.filter;renderApp();},
    'clear-search':()=>{s.query='';renderApp();$('#point-search')?.focus();},
    'clear-filter':()=>{s.query='';s.filter='all';renderApp();},
    'back-map':()=>{s.page='map';render();},
    'start-navigation':()=>{if(s.order||s.rest){toast('请先完成当前任务。');return;}s.spot=selectedPoint();s.nav='spot';s.page='navigation';s.parked=false;render();},
    'cancel-navigation':()=>{s.nav=null;s.parked=true;s.page='detail';render();toast('已结束前往演示。');},
    'arrived':arrived,'picked-up':pickedUp,'finish-order':finishOrder,
    'save-point':()=>{const p=selectedPoint(),i=s.saved.indexOf(p.id);i<0?s.saved.push(p.id):s.saved.splice(i,1);renderApp();toast(i<0?'已收藏这个落脚点。':'已取消收藏。');},
    'open-hub':goHub,
    'mode':b=>{s.configMode=b.dataset.mode;renderApp();},
    'duration':b=>{s.duration=Number(b.dataset.value);renderApp();},
    'toggle-online-meal':()=>{s.keepOnline=!s.keepOnline;renderApp();},
    'begin-rest':startRest,
    'end-rest':finishRest,
    'extend-rest':()=>{if(!s.rest)return;s.rest.endsAt=Math.max(Date.now(),s.rest.endsAt)+5*60000;s.rest.expired=false;renderApp();toast('已延长 5 分钟。');},
    'check':b=>{const i=Number(b.dataset.index);s.checks[i]=!s.checks[i];renderApp();},
    'resume':()=>{if(!s.checks.every(Boolean))return;s.needsPreparation=false;s.rest=null;s.parked=true;s.online=!s.order;s.light=true;if(s.order){s.nav='pickup';s.parked=false;s.page='navigation';}else{s.page='map';s.waitingSince=Date.now();}render();toast(s.order?'准备完成，前往接驾。':'已恢复在线候单。');},
    'zoom-in':()=>{s.zoom=Math.min(1.6,s.zoom+.15);renderApp();},
    'zoom-out':()=>{s.zoom=Math.max(.85,s.zoom-.15);renderApp();},
    'recenter':()=>{s.zoom=1;renderApp();toast('已回到当前位置。');},
    'tab':b=>{const p=b.dataset.page;if(p==='hub'){if(s.needsPreparation){s.page='recovery';render();return;}goHub();return;}if(p==='map'){if(s.needsPreparation){s.page='recovery';render();return;}if(s.rest){s.page=s.rest.mode==='away'?'away':'rest';render();toast('当前仍在休整。结束并确认准备后可恢复工作。');return;}s.page=s.order||s.nav?'navigation':'map';}else{s.page=p;}render();},
    'controls-shortcut':()=>{s.page='controls';render();},
    'view-current':()=>{if(!s.order)return;if(s.needsPreparation){s.page='recovery';}else{s.nav=s.order.stage;s.page='navigation';}render();},
    'call-passenger':()=>openOverlay('call'),
    'temp-minus':()=>changeTemp(-.5),
    'temp-plus':()=>changeTemp(.5),
    'climate':()=>openOverlay('climate'),
    'toggle-vent':()=>{s.vent=!s.vent;render();},
    'vent':()=>{s.vent=!s.vent;render();toast(s.vent?'通风已开启。':'通风已关闭。');},
    'toggle-light':()=>{s.light=!s.light;render();},
    'mute':()=>{s.muted=!s.muted;renderDock();toast(s.muted?'媒体已静音，关键订单提示仍保留。':'已取消媒体静音。');},
    'dispatch-settings':()=>openOverlay('dispatch'),
    'dispatch-toggle':()=>{if(s.rest||s.order)return;if(s.needsPreparation){closeOverlay();s.page='recovery';render();toast('请先确认空间与驾驶准备。');return;}s.online=!s.online;closeOverlay();render();toast(s.online?'已恢复候单。':'已暂停接单。');},
    'return-task':()=>{closeOverlay();if(s.rest)s.page=s.rest.mode==='away'?'away':'rest';else if(s.order)s.page=s.nav?'navigation':'recovery';render();},
    'accept-order':acceptOrder,
    'decline-order':()=>{closeOverlay();toast('本次订单未接受，保持当前状态。');},
    'close-overlay':closeOverlay,
    'complete-rest':()=>{closeOverlay();s.page='hub';render();},
    'complete-map':()=>{closeOverlay();s.page='map';s.online=true;s.waitingSince=Date.now();render();},
    'overlay-backdrop':(_,e)=>{if(e.target.classList.contains('overlay'))closeOverlay();}
  };
  function changeTemp(delta){s.temp=Math.min(28,Math.max(18,s.temp+delta));renderDock();if(s.page==='controls'||s.page==='rest')renderApp();if(s.overlay==='climate')renderOverlay();}
  document.addEventListener('click',e=>{
    const button=e.target.closest('[data-action]');if(!button||button.disabled)return;
    // A modal's inner whitespace must not activate the backdrop's action.
    if(button.classList.contains('overlay')&&e.target!==button)return;
    actions[button.dataset.action]?.(button,e);
  });
  document.addEventListener('input',e=>{
    if(e.target.id==='point-search'){const input=e.target,pos=input.selectionStart;s.query=input.value;renderApp();const next=$('#point-search');next?.focus();try{next?.setSelectionRange(pos,pos);}catch(_){} }
    if(e.target.id==='fan-range'){s.fan=Number(e.target.value);s.vent=true;renderDock();const label=e.target.closest('.control-panel,.modal')?.querySelector('.control-line:nth-of-type(2) small');if(label)label.textContent=`已开启 · 风量 ${s.fan} 档`;}
  });
  document.addEventListener('change',e=>{if(e.target.id==='fan-range'){if(s.overlay==='climate')renderOverlay();else if(s.page==='controls')renderApp();}});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&s.overlay){closeOverlay();return;}
    if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute('role')==='button'&&e.target.dataset.action){e.preventDefault();actions[e.target.dataset.action]?.(e.target,e);}
    if(e.key==='Tab'&&s.overlay){const all=[...$('#overlay-root').querySelectorAll('button:not(:disabled),input,select,[tabindex="0"]')];const first=all[0],last=all.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}
  });
  $('#demo-event').addEventListener('click',()=>{if(s.page==='navigation'){if(s.nav==='spot')arrived();else if(s.nav==='pickup')pickedUp();else if(s.nav==='dropoff')finishOrder();}else requestOrder();});
  $('#demo-reset').addEventListener('click',()=>{s=initial();render();toast('演示已重置。');});
  $('#demo-start').addEventListener('click',()=>{s=initial();s.page='map';s.filter='food';render();});
  $('#demo-guide').addEventListener('click',()=>openOverlay('guide'));
  $('#demo-period').addEventListener('change',e=>{
    if(s.order||s.rest||s.nav||s.page==='recovery'){e.target.value=s.period;toast('请先完成当前流程，再切换演示时段。');return;}
    s.period=e.target.value;s.selected=null;s.spot=null;s.query='';s.filter='all';s.page=s.page==='home'?'home':'map';render();
  });
  $('#demo-full').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('#screen-holder').requestFullscreen();}catch(_){toast('当前环境不支持全屏，可放大浏览器窗口。');}});
  function resize(){const rect=$('#screen-holder').getBoundingClientRect(),scale=Math.min((rect.width-8)/1440,(rect.height-8)/810);$('#screen').style.transform=`translate(-50%,-50%) scale(${scale})`;}
  new ResizeObserver(resize).observe($('#screen-holder'));document.addEventListener('fullscreenchange',resize);
  setInterval(()=>{
    const timer=$('#rest-timer');if(timer&&s.rest)timer.textContent=formatTime(remaining());
    const waiting=$('#waiting-time');if(waiting)waiting.textContent=Math.floor((Date.now()-s.waitingSince)/60000);
    if(s.rest&&remaining()===0&&!s.rest.expired){s.rest.expired=true;renderApp();toast('休整时间到了。准备好后再主动恢复工作。');}
  },1000);
  render();resize();
})();

</script>
</body>
</html>
